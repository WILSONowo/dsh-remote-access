name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    name: Plugin (dsh-remote-access)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm ci --legacy-peer-deps
      - name: Build (src → lib)
        run: npm run build && npm run build:client
      - name: Test plugin on built output
        run: npm test
      # prepack 生命周期会再跑 typecheck+build+test 并产出 tgz
      - name: Pack
        run: npm pack
      # Attach SHA256SUMS to every Release so users can verify the package they install into DSH.
      - name: Checksums
        run: sha256sum dsh-remote-access-*.tgz > SHA256SUMS && cat SHA256SUMS
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: dsh-remote-access-tgz
          path: |
            dsh-remote-access-*.tgz
            SHA256SUMS
          if-no-files-found: error
