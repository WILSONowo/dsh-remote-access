version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Types track the Node major CI and DSH run on (22); bump together with node-version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript majors change the compiler; upgrade deliberately, not via Dependabot.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
